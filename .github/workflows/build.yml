name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk bablo-67.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bablo-67-apk
          path: bablo-67.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bablo-${{ github.run_number }}
          name: БАБЛО 67 (сборка ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: Ультимативная кнопка БАБЛО. Скачай bablo-67.apk и установи 🤝
          files: bablo-67.apk
